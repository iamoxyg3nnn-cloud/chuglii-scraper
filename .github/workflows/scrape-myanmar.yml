name: Chuglii Myanmar Auto Scraper
run-name: Myanmar Scraper ${{ github.event.inputs.pages && format('({0} pages)', github.event.inputs.pages) || '(scheduled full-site)' }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or category to scrape (myanmar, mamagyi, mmporns, all)'
        required: false
        default: 'myanmar'
      pages:
        description: 'Number of pages per tag'
        required: false
        default: '25'
      workers:
        description: 'Number of concurrent enrichment workers'
        required: false
        default: '6'
      all_tags:
        description: 'Crawl all site tags sequentially (full website)'
        required: false
        default: 'true'
      continuous:
        description: 'Self-chain upon completion for continuous 24/7 indexing'
        required: false
        default: 'true'
  schedule:
    # Runs every 4 hours to index newly published Myanmar videos
    - cron: '15 */4 * * *'

concurrency:
  group: scraper-myanmar
  cancel-in-progress: true

jobs:
  scrape-myanmar:
    name: Scrape Buu Mal (Myanmar Full Catalog)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write
      actions: write

    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://supabase.chuglii.in' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Scraper Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Run Myanmar Full Catalog Scraper
        id: scrape-step
        env:
          TARGET_TAG: ${{ github.event.inputs.tag || 'myanmar' }}
          PAGES: ${{ github.event.inputs.pages || '25' }}
          WORKERS: ${{ github.event.inputs.workers || '6' }}
          ALL_TAGS: ${{ github.event.inputs.all_tags || 'true' }}
        run: |
          echo "=========================================================="
          echo "Starting Buu Mal (Myanmar) Full Catalog Scraper"
          echo "Target Tag: $TARGET_TAG"
          echo "Pages:      $PAGES"
          echo "Workers:    $WORKERS"
          echo "All Tags:   $ALL_TAGS"
          echo "Storage:    scraper.myanmar_videos (Segregated Isolated)"
          echo "=========================================================="

          CMD="python -u scraper/categories/myanmar/pipeline.py --pages $PAGES --workers $WORKERS"
          if [ "$ALL_TAGS" = "true" ]; then
            CMD="$CMD --all-tags"
          else
            CMD="$CMD --tag $TARGET_TAG"
          fi

          echo "[*] Executing: $CMD"
          eval $CMD

      - name: Persist Scraper Progress Checkpoint
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scraper/categories/myanmar/checkpoint.json scraper/categories/myanmar/known_post_ids.json || true
          if ! git diff --staged --quiet; then
            echo "[*] Checkpoint progress detected. Committing updates..."
            git commit -m "chore: persist myanmar scraper catalog progress [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push origin "${{ github.ref_name }}" || true
            echo "[✓] Myanmar catalog progress successfully saved to repo."
          else
            echo "[*] No checkpoint changes to commit."
          fi

      - name: Autotrigger successor run for continuous full-site indexing
        if: ${{ always() && steps.scrape-step.outcome == 'success' && (github.event.inputs.continuous == 'true' || github.event_name == 'schedule') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo ""
          echo "+=============================================================+"
          echo "|  BATCH COMPLETED CLEANLY - DISPATCHING SUCCESSOR            |"
          echo "+=============================================================+"
          gh workflow run scrape-myanmar.yml \
            --ref "${{ github.ref_name }}" \
            -f tag="${{ github.event.inputs.tag || 'myanmar' }}" \
            -f pages="${{ github.event.inputs.pages || '25' }}" \
            -f workers="${{ github.event.inputs.workers || '6' }}" \
            -f all_tags="${{ github.event.inputs.all_tags || 'true' }}" \
            -f continuous="true" || true
          echo "[✓] Continuous successor dispatched."

name: Chuglii All-In-One Auto Scraper Fleet
run-name: Scraper Fleet ${{ github.event.inputs.triggered_by && format('({0})', github.event.inputs.triggered_by) || '(scheduled all-feeds)' }}

on:
  workflow_dispatch:
    inputs:
      triggered_by:
        description: 'Source of the trigger'
        required: false
        default: 'manual'
      session_minutes:
        description: 'Daemon session duration in minutes (max ~320 for GitHub Actions)'
        required: false
        default: '300'
      interval_seconds:
        description: 'Interval between scan cycles in seconds (default: 60 = 1m)'
        required: false
        default: '60'
  schedule:
    # Watchdog trigger every 6 hours in case self-chaining misses or is interrupted
    - cron: '0 */6 * * *'

# Strict Anti-Queue Concurrency: cancel any older/stuck run immediately when a new one starts
concurrency:
  group: scrapers-auto-sync
  cancel-in-progress: true

jobs:
  scrape-fleet:
    name: Scrape All Categories (Viral MMS, Japanese JAV, Myanmar & OnlyFans)
    runs-on: ubuntu-latest
    timeout-minutes: 355 # 5h55m (under GitHub's 360m hard limit)

    permissions:
      contents: write # Required to push checkpoint progress back to repository
      actions: write # Required for self-chaining workflow dispatch

    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://supabase.chuglii.in' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Scraper Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt
          python -m patchright install --with-deps chromium

      - name: Verify Runner Egress Network
        run: |
          echo "[*] Runner Egress Network Profile:"
          curl -s https://cloudflare.com/cdn-cgi/trace | grep -E "ip|loc|warp" || true

      - name: Run Unified Human-Adaptive Scraper Daemon
        id: scraper-daemon
        env:
          SESSION_MINS: ${{ github.event.inputs.session_minutes || '300' }}
          INTERVAL_SECS: ${{ github.event.inputs.interval_seconds || '60' }}
        run: |
          echo "=========================================================="
          echo "Starting Chuglii All-In-One Unified Scraper Fleet"
          echo "Feed 1: Viral MMS (MMSVibeX -> scraper.videos)"
          echo "Feed 2: Japanese JAV (SupJav -> scraper.japanese_videos)"
          echo "Feed 3: Myanmar (Buu Mal -> scraper.myanmar_videos)"
          echo "Feed 4: OnlyFans Leaks (Multi-Site Aggregator -> scraper.onlyfans_videos)"
          echo "Mode: 24/7 Self-Chaining Continuous Daemon"
          echo "Session Duration: ${SESSION_MINS} minutes"
          echo "Scan Interval:    ${INTERVAL_SECS} seconds"
          echo "=========================================================="

          python -u scraper/unified_scraper.py \
            --daemon \
            --session-minutes "$SESSION_MINS" \
            --interval "$INTERVAL_SECS" \
            --workers 4

      - name: Persist Scraper Progress Checkpoints
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          for f in \
            scraper/categories/viral-mms/checkpoint.json \
            scraper/categories/viral-mms/known_post_ids.json \
            scraper/categories/japanese/checkpoint.json \
            scraper/categories/japanese/known_post_ids.json \
            scraper/categories/japanese/cf_session.json \
            scraper/categories/myanmar/checkpoint.json \
            scraper/categories/myanmar/known_post_ids.json \
            scraper/categories/onlyfans/checkpoint.json \
            scraper/categories/onlyfans/known_post_ids.json \
            scraper/categories/onlyfans/progress.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          if ! git diff --staged --quiet; then
            echo "[*] Checkpoint progress detected across scrapers. Committing updates..."
            git diff --staged --name-only || true
            git commit -m "chore: persist unified scrapers progress checkpoints [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push origin "${{ github.ref_name }}" || true
            echo "[OK] All scraper progress checkpoints successfully saved to repo."
          else
            echo "[*] No checkpoint changes to commit."
          fi

      - name: Autotrigger successor run without queuing
        id: self-chain
        if: ${{ always() && steps.scraper-daemon.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo ""
          echo "+=============================================================+"
          echo "|  SESSION COMPLETED CLEANLY - DISPATCHING SUCCESSOR          |"
          echo "+=============================================================+"

          # Dispatches successor run. With cancel-in-progress: true, there is zero queuing backlog.
          gh workflow run scrapers-auto-sync.yml \
            --ref "${{ github.ref_name }}" \
            -f triggered_by="self-chain" \
            -f session_minutes="${{ github.event.inputs.session_minutes || '300' }}" \
            -f interval_seconds="${{ github.event.inputs.interval_seconds || '60' }}" || true

          echo "[✓] Successor workflow dispatched. 24/7 handoff complete."

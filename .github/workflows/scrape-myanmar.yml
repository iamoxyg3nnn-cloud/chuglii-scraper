name: Chuglii Myanmar Auto Scraper
run-name: Myanmar Scraper ${{ github.event.inputs.pages && format('({0} pages)', github.event.inputs.pages) || '(scheduled)' }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or category to scrape (myanmar, mamagyi, mmporns, all)'
        required: false
        default: 'myanmar'
      pages:
        description: 'Number of pages to scrape'
        required: false
        default: '15'
      workers:
        description: 'Number of concurrent enrichment workers'
        required: false
        default: '6'
  schedule:
    # Runs every 6 hours to capture new Myanmar releases
    - cron: '30 */6 * * *'

concurrency:
  group: scraper-myanmar
  cancel-in-progress: true

jobs:
  scrape-myanmar:
    name: Scrape Buu Mal (Myanmar)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://supabase.chuglii.in' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Scraper Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Run Myanmar Scraper Pipeline
        env:
          TARGET_TAG: ${{ github.event.inputs.tag || 'myanmar' }}
          PAGES: ${{ github.event.inputs.pages || '15' }}
          WORKERS: ${{ github.event.inputs.workers || '6' }}
        run: |
          echo "=========================================================="
          echo "Starting Buu Mal (Myanmar) Scraper"
          echo "Target Tag: $TARGET_TAG"
          echo "Pages:      $PAGES"
          echo "Workers:    $WORKERS"
          echo "Storage:    scraper.myanmar_videos (Segregated Isolated)"
          echo "=========================================================="

          python -u scraper/categories/myanmar/pipeline.py \
            --tag "$TARGET_TAG" \
            --pages "$PAGES" \
            --workers "$WORKERS"

      - name: Persist Scraper Progress Checkpoint
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scraper/categories/myanmar/checkpoint.json scraper/categories/myanmar/known_post_ids.json || true
          if ! git diff --staged --quiet; then
            echo "[*] Checkpoint progress detected. Committing updates..."
            git commit -m "chore: persist myanmar scraper catalog progress [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push origin "${{ github.ref_name }}" || true
            echo "[✓] Myanmar catalog progress successfully saved to repo."
          else
            echo "[*] No checkpoint changes to commit."
          fi

name: Chuglii All-In-One Auto Scraper Fleet
run-name: Scraper Fleet ${{ github.event.inputs.triggered_by && format('({0})', github.event.inputs.triggered_by) || '(scheduled all-feeds)' }}

on:
  workflow_dispatch:
    inputs:
      triggered_by:
        description: 'Source of the trigger'
        required: false
        default: 'manual'
      session_minutes:
        description: 'Daemon session duration in minutes (max ~320 for GitHub Actions)'
        required: false
        default: '300'
      interval_seconds:
        description: 'Interval between scan cycles in seconds (default: 60 = 1m)'
        required: false
        default: '60'
      deep_backfill:
        description: 'Activate deep backfill until archives are fully indexed (none | chinese | fangsung | studios | all)'
        required: false
        default: 'none'
  schedule:
    # Watchdog trigger every 6 hours in case self-chaining misses or is interrupted
    - cron: '0 */6 * * *'

# Serialize runs without cancelling the predecessor: a self-chained successor
# used to cancel its parent mid-checkpoint-commit with cancel-in-progress: true.
concurrency:
  group: scrapers-auto-sync
  cancel-in-progress: false

jobs:
  guard:
    name: Check Scraper Kill Switch
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
      duplicate: ${{ steps.queue.outputs.duplicate }}
    steps:
      - name: Check SCRAPER_ENABLED repository variable
        id: check
        run: |
          if [ "${{ vars.SCRAPER_ENABLED }}" = "false" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "[STOP] SCRAPER_ENABLED=false. Skipping scraper fleet."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "[OK] Scraper fleet enabled."
          fi

      - name: Skip duplicate queued runs
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          queued=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/scrapers-auto-sync.yml/runs?status=queued&per_page=100" --jq '.total_count' || echo 0)
          if [ "${queued:-0}" -gt 1 ]; then
            echo "duplicate=true" >> "$GITHUB_OUTPUT"
            echo "[STOP] Another successor run is already queued; skipping this duplicate."
          else
            echo "duplicate=false" >> "$GITHUB_OUTPUT"
          fi

  scrape-fleet:
    name: Scrape All Feeds (Viral MMS, Japanese JAV, Myanmar, OnlyFans, Voyeur House & Chinese)
    needs: guard
    if: needs.guard.outputs.enabled == 'true' && needs.guard.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355 # 5h55m (under GitHub's 360m hard limit)

    permissions:
      contents: write # Required to push checkpoint progress back to repository
      actions: write # Required for self-chaining workflow dispatch

    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://supabase.chuglii.in' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Scraper Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt
          python -m patchright install --with-deps chromium

      - name: Ensure ffprobe (HLS quality probing)
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            echo "ffprobe missing; installing ffmpeg"
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffprobe -version | head -1

      - name: Verify Runner Egress Network
        run: |
          echo "[*] Runner Egress Network Profile:"
          curl -s https://cloudflare.com/cdn-cgi/trace | grep -E "ip|loc|warp" || true

      - name: Activate Deep Backfill (requested)
        # Sets a persistent flag in the DB; every chained session keeps
        # grinding the archive backlog until all zones report complete, then
        # the fleet auto-deactivates deep mode.
        if: ${{ github.event.inputs.deep_backfill != '' && github.event.inputs.deep_backfill != 'none' }}
        run: python -X utf8 scraper/deep_backfill.py set ${{ github.event.inputs.deep_backfill }}

      - name: Run Unified Human-Adaptive Scraper Daemon
        id: scraper-daemon
        env:
          SESSION_MINS: ${{ github.event.inputs.session_minutes || '300' }}
          INTERVAL_SECS: ${{ github.event.inputs.interval_seconds || '60' }}
        run: |
          echo "=========================================================="
          echo "Starting Chuglii All-In-One Unified Scraper Fleet"
          echo "Feed 1: Viral MMS (MMSVibeX -> scraper.videos)"
          echo "Feed 2: Japanese JAV (SupJav -> scraper.japanese_videos)"
          echo "Feed 3: Myanmar (Buu Mal -> scraper.myanmar_videos)"
          echo "Feed 4: OnlyFans Leaks (Multi-Site Aggregator -> scraper.onlyfans_videos)"
          echo "Feed 5: Voyeur House (5 isolated websites -> isolated per-site tables)"
          echo "Feed 6: Chinese (uxj838238 -> scraper.chinese_videos, 37 zones, JAV/livestream excluded)"
          echo "Feed 7: Fangsung (www.fangsung.com -> scraper.fangsung_videos, region terms)"
          echo "Feed 8: Studios (madouer.cc -> scraper.studios_videos, site sections)"
          echo "Mode: 24/7 Self-Chaining Continuous Daemon"
          echo "Session Duration: ${SESSION_MINS} minutes"
          echo "Scan Interval:    ${INTERVAL_SECS} seconds"
          echo "=========================================================="

          python -u scraper/unified_scraper.py \
            --daemon \
            --session-minutes "$SESSION_MINS" \
            --interval "$INTERVAL_SECS" \
            --workers 4

      - name: Backfill English Titles (Chinese safety net)
        # Translation now happens at ingest, but this catches any rows that
        # landed untranslated (ingest failures, older sessions) so the
        # English-only UI never shows CJK fallbacks.
        if: ${{ !cancelled() }}
        run: python -X utf8 scraper/categories/chinese/translate_backfill.py --limit 2000 || true

      - name: Backfill English Titles (fangsung safety net)
        # Same safety net for the fangsung category: ingest-time translation
        # plus a catch-up pass so the English-only UI never shows CJK.
        if: ${{ !cancelled() }}
        run: python -X utf8 scraper/categories/fangsung/translate_backfill.py --limit 2000 || true

      - name: Backfill English Titles (studios safety net)
        # Same safety net for the studios category: ingest-time translation
        # plus a catch-up pass so the English-only UI never shows CJK.
        if: ${{ !cancelled() }}
        run: python -X utf8 scraper/categories/studios/translate_backfill.py --limit 2000 || true

      - name: Sweep Archive Id Space (OnlyFans / borntobefuck)
        # Listings only ever show a rolling ~1-month window (597 of ~23k ids), so
        # the archive is only reachable by walking the id space directly. The
        # cursor is persisted in Supabase, so each run continues where the last
        # one stopped and a killed run still keeps its progress.
        if: ${{ !cancelled() }}
        run: python -X utf8 scraper/categories/onlyfans/sweep_ids.py --minutes 60 --workers 6 || true

      - name: Revalidate Dead Streams (OnlyFans)
        # Layer 2 of the dead-video gate. Ingest (Layer 1) cannot know that a
        # CDN object will be deleted tomorrow: uncut-x lost 3,080 R2 objects
        # out of 4,445 videos. This re-probes the least recently verified rows,
        # stamps survivors and soft-deletes (status='dead') the rest so they
        # drop out of the public feed without losing the row.
        if: ${{ !cancelled() }}
        run: python -X utf8 scraper/categories/onlyfans/verify_dead.py --limit 200 || true

      - name: Persist Scraper Progress Checkpoints
        # Never commit/push checkpoints from a cancelled run: partial cycles can
        # poison known-ID caches, and cancellation must remain a hard stop.
        if: ${{ !cancelled() }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          for f in \
            scraper/categories/viral-mms/checkpoint.json \
            scraper/categories/viral-mms/known_post_ids.json \
            scraper/categories/viral-mms/sites_checkpoint.json \
            scraper/categories/viral-mms/sites_known_post_ids.json \
            scraper/categories/viral-mms/sites_progress.json \
            scraper/categories/japanese/checkpoint.json \
            scraper/categories/japanese/known_post_ids.json \
            scraper/categories/myanmar/checkpoint.json \
            scraper/categories/myanmar/known_post_ids.json \
            scraper/categories/myanmar/samusar_checkpoint.json \
            scraper/categories/myanmar/samusar_known_post_ids.json \
            scraper/categories/myanmar/samusar_progress.json \
            scraper/categories/onlyfans/checkpoint.json \
            scraper/categories/onlyfans/known_post_ids.json \
            scraper/categories/onlyfans/progress.json \
            scraper/categories/voyeurhouse/checkpoint.json \
            scraper/categories/voyeurhouse/known_post_ids.json \
            scraper/categories/voyeurhouse/progress.json \
            scraper/categories/chinese/checkpoint.json \
            scraper/categories/chinese/known_post_ids.json \
            scraper/categories/chinese/progress.json \
            scraper/categories/fangsung/checkpoint.json \
            scraper/categories/fangsung/known_post_ids.json \
            scraper/categories/fangsung/progress.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          if ! git diff --staged --quiet; then
            echo "[*] Checkpoint progress detected across scrapers. Committing updates..."
            git diff --staged --name-only || true
            git commit -m "chore: persist unified scrapers progress checkpoints [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push origin "${{ github.ref_name }}" || true
            echo "[OK] All scraper progress checkpoints successfully saved to repo."
          else
            echo "[*] No checkpoint changes to commit."
          fi

      - name: Autotrigger successor run without queuing
        id: self-chain
        if: ${{ !cancelled() && steps.scraper-daemon.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo ""
          echo "+=============================================================+"
          echo "|  SESSION COMPLETED CLEANLY - DISPATCHING SUCCESSOR          |"
          echo "+=============================================================+"

          # Dispatches a successor that waits for this run to finish (serialized
          # concurrency), so checkpoint commits are never cancelled mid-write.
          gh workflow run scrapers-auto-sync.yml \
            --ref "${{ github.ref_name }}" \
            -f triggered_by="self-chain" \
            -f session_minutes="${{ github.event.inputs.session_minutes || '300' }}" \
            -f interval_seconds="${{ github.event.inputs.interval_seconds || '60' }}" || true

          echo "[✓] Successor workflow dispatched. 24/7 handoff complete."

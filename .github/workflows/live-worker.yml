name: Live Worker (metadata fleet)

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "Session duration in minutes"
        default: "55"
  schedule:
    # Hourly top-up alongside the scraper fleet.
    - cron: "25 * * * *"

permissions:
  contents: read

concurrency:
  group: live-worker
  cancel-in-progress: false

jobs:
  live-worker:
    name: Scrape + translate + quality-probe live catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt pycryptodome

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Run live worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "=========================================================="
          echo "Chuglii Live Worker (metadata only — no media stored)"
          echo "  scrape catalogue -> Supabase live_streams"
          echo "  English titles + real playback quality probes"
          echo "  playback itself streams via the edge media proxy"
          echo "=========================================================="
          python -u scraper/live_worker.py --session-minutes "${{ github.event.inputs.session_minutes || '50' }}"

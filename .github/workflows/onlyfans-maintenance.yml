name: OnlyFans Maintenance (sweep, revalidate, health)

# Why this is a SEPARATE workflow and not a step in scrapers-auto-sync.yml:
#
# The fleet runs a 300-minute daemon inside a job whose timeout is 355 minutes.
# The onlyfans maintenance steps used to run AFTER that daemon, so
# daemon (300) + sweep (60) = 360 minutes exceeded the timeout and they could
# never complete. The workflow-watchman also cancels fleet runs around the
# 5.5 h mark. Net effect: the archive sweep and the dead-stream revalidation
# were configured but unreachable -- the sweep cursor would never advance and
# nothing would ever be revalidated in CI.
#
# Maintenance is independent of feed ingestion, so it gets its own schedule and
# its own concurrency group. It always runs, and it finishes in well under an
# hour for the sweep budget plus a few minutes for the rest.

on:
  schedule:
    # Offset from the fleet's 6-hourly trigger so the two do not start together.
    - cron: "25 */6 * * *"
  workflow_dispatch:
    inputs:
      sweep_minutes:
        description: "Archive sweep wall-clock budget (minutes)"
        required: false
        default: "90"
      revalidate_limit:
        description: "Rows to re-probe per source"
        required: false
        default: "200"

permissions:
  contents: read

concurrency:
  group: onlyfans-maintenance
  # Serialise: a second run must not race the sweep cursor or double-probe.
  cancel-in-progress: false

jobs:
  maintenance:
    name: Sweep archive + revalidate streams + health gate
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://supabase.chuglii.in' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install Scraper Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Install headless browser (Cloudflare solver)
        # net.py escalates challenges/WAF blocks to Scrapling's StealthyFetcher,
        # which drives Chromium through patchright. Without this step every solve
        # in this workflow died with "BrowserType.launch_persistent_context:
        # Executable doesn't exist at ~/.cache/ms-playwright/chromium-1248"
        # (seen on content.zavastream.com during the sweep).
        run: python -m patchright install --with-deps chromium

      - name: Ledger Report (detect a false-dead episode)
        # The sweep now refuses to persist lopsided verdicts, but a site outage
        # that slips through is only visible in the ledger: a burst of `dead`
        # rows with no `stored` rows in the same hour is the signature
        # (2026-11-28: 5,328 dead, 0 stored while the origin answered HTTP 200
        # with "Internal server error.").
        run: |
          python -X utf8 scraper/tools/onlyfans_ledger_repair.py --report --site borntobefuck || true
          python -X utf8 scraper/tools/onlyfans_ledger_repair.py --site borntobefuck || true

      - name: Sweep Archive Id Space (borntobefuck)
        # Listings show a rolling ~1-month window (597 of ~23k ids), so the
        # archive is only reachable by walking the id space. The cursor lives in
        # Supabase, so a run that stops early resumes exactly where it left off.
        run: |
          python -X utf8 scraper/categories/onlyfans/sweep_ids.py \
            --minutes "${{ github.event.inputs.sweep_minutes || '90' }}" \
            --workers 6

      - name: Revalidate Dead Streams
        # Layer 2 of the dead-video gate: CDN objects disappear after ingest.
        #
        # 200/night was far too small a batch: sheeshfans alone has ~5,900 rows,
        # so one full cycle took a month and 1,000 dead embeds (HTTP 410) stayed
        # in the public feed the whole time. A probe is one ranged request, so a
        # much larger batch still fits this window.
        run: |
          python -X utf8 scraper/categories/onlyfans/verify_dead.py \
            --limit "${{ github.event.inputs.revalidate_limit || '1500' }}" \
            --workers 12

      - name: Backfill Missing Durations
        # influencersgonewild publishes no duration and sheeshfans only
        # sometimes does, so their rows used to inherit the table default 600 s
        # and read "10:00". Ingest now measures what it can; this drains the
        # historical backlog a bounded batch at a time -- no manual repair.
        run: |
          python -X utf8 scraper/tools/onlyfans_duration_backfill.py \
            --minutes 10 --workers 12

      - name: Health Gate
        # Deliberately NOT suffixed with `|| true`: a source that silently stops
        # producing must mark this run failed instead of looking healthy.
        run: python -X utf8 scraper/tools/onlyfans_health.py --max-stale-days 7

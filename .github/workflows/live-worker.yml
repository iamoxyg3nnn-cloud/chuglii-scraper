name: Live Worker (remux fleet)

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "Session duration in minutes"
        default: "55"
  schedule:
    # Hourly top-up: remux any catalogue videos that still lack a clean copy.
    - cron: "25 * * * *"

permissions:
  contents: read

concurrency:
  group: live-worker
  cancel-in-progress: false

jobs:
  live-worker:
    name: Scrape + remux + upload live streams
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt pycryptodome

      - name: Verify ffmpeg
        run: ffmpeg -version | head -1

      - name: Run live worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET: live-remux
        run: |
          echo "=========================================================="
          echo "Chuglii Live Worker"
          echo "  scrape -> ffmpeg remux (silence-filled audio + loudness)"
          echo "  -> Cloudflare R2 -> Supabase live_streams"
          echo "=========================================================="
          python -u scraper/live_worker.py --session-minutes "${{ github.event.inputs.session_minutes || '50' }}"
